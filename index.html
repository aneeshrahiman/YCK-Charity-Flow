<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>YCK Charity Flow</title></head><body><p>Loading YCK Charity Flow…</p><script>(async()=>{const get=async p=>(await fetch(p)).text();const html=(await Promise.all([1,2,3,4,5,6].map(i=>get('parts/index.'+i)))).join('');const css=await get('styles.css');const code=(await Promise.all([1,2,3,4,5,6,7,8].map(i=>get('parts/app.'+i)))).join('');const page=html.replace('</head>','<style>'+css+'</style></head>').replace('<script src="app.js"></script>','<script>'+code+'<\/script>');document.open();document.write(page);document.close()})().catch(e=>{document.body.innerHTML='<h2>Unable to load YCK Charity Flow</h2><pre>'+e+'</pre>'})</script></body></html>
